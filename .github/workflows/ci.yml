name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck agy-account
        run: shellcheck --severity=warning bin/agy-account
      - name: compile agy-usage
        run: python3 -m py_compile bin/agy-usage
